<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <div id="picker-screen" class="screen">
        <p>メモを保存するフォルダを選んでください。</p>
        <button id="pick-folder">フォルダを選ぶ</button>
      </div>
      <div id="notes-screen" class="screen" hidden>
        <div id="sidebar">
          <div id="sidebar-header">
            <div id="sidebar-actions">
              <button id="new-note" title="新規メモ">＋ 新規</button>
              <button id="change-folder" title="保存先フォルダを変更">フォルダ変更</button>
            </div>
            <div id="folder-label"></div>
            <input id="search" placeholder="検索…" />
          </div>
          <div id="file-list"></div>
        </div>
        <div id="sidebar-backdrop"></div>
        <div id="editor">
          <div id="editor-header">
            <button id="toggle-sidebar" title="ファイル一覧を表示/隠す" aria-label="ファイル一覧を表示/隠す" aria-expanded="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 6h16M4 12h16M4 18h16" />
              </svg>
            </button>
            <input id="title" placeholder="無題のメモ" />
          </div>
          <textarea id="content" placeholder="ここに書く…（# 見出し、**太字**、- 箇条書き に対応）"></textarea>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
